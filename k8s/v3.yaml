apiVersion: apps/v1
kind: Deployment
metadata:
  name: coupon-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coupon-v3
  template:
    metadata:
      labels:
        app: coupon-v3
    spec:
      containers:
        - name: coupon-v3
          image: mageshkavi05/coupon-system-v3:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: coupon-v3-service
spec:
  type: NodePort
  selector:
    app: coupon-v3
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30083
