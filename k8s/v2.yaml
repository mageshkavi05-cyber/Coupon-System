
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coupon-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coupon-v2
  template:
    metadata:
      labels:
        app: coupon-v2
    spec:
      containers:
        - name: coupon-v2
          image: mageshkavi05/coupon-system-v2:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: coupon-v2-service
spec:
  type: NodePort
  selector:
    app: coupon-v2
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30082
