
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coupon-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coupon-system
  template:
    metadata:
      labels:
        app: coupon-system
    spec:
      containers:
        - name: coupon-system
          image: mageshkavi05/coupon-system:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: coupon-system-service
spec:
  type: NodePort
  selector:
    app: coupon-system
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30080
